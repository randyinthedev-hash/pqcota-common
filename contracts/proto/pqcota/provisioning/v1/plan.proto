// PQC 마이그레이션 플랫폼 — 확정 계획(프로비저닝 입력) 스키마 (SSOT, PROVISIONING 단계)
//
// 규정서 §4.1(계획 vs 실행 분리) · 프로비저닝 설계 §4.1·§4.2(remediation taxonomy) · §4.3(단계적 배포 L1/L2/L3)
// · §3.7(finalized = 프로비저닝 유일 실행 근거). 인벤토리 설계 §2(FinalizedPlan·PlanItem)를 정식화.
//
// 책임 경계(§5):
//   스키마(이 파일)  = 이 리포의 SSOT — 전 컴포넌트가 동일 어휘를 쓴다.
//   조치 아티팩트 생성 = pkg/provisioning(결정론, 프로비저닝 설계 §4.1·§4.2 표 → config 조각). 파생·재생성 가능(§1.2).
//   계획 저작·리뷰-확정 = 이 리포가 하지 않는다(거버넌스 엔진, §3.3③).
//   L3(활성화·재시작)는 사용자가 준 ActivationHooks를 의미 순서로 실행한다. fleet 규모 조율(drain·rolling)은 여기 없다.
// → "무엇을·어떤 순서로"(리뷰어, 계획 레이어)와 "어떻게 안전하게"(플랫폼, 실행 레이어)를 섞지 않는다(§4.1).

syntax = "proto3";

package pqcota.provisioning.v1;

import "google/protobuf/timestamp.proto";
import "pqcota/common/v1/common.proto";

option go_package = "github.com/randyinthedev-hash/pqcota-common/gen/pqcota/provisioning/v1;provisioningv1";

// 단계적 배포 위임 레벨 (규정서 §4.3). 자산별 1급 속성 `deploy_automation_level`.
// ★ Discovery 산출물(Finding)이 아니다 — 리뷰어가 자산별로 판정하는 계획·자산 속성(MANUAL, §4.7).
//   Collector는 이 값을 채우지 않는다. 확정 계획(plan) 엔티티에 실린다.
enum DeployAutomationLevel {
  DEPLOY_AUTOMATION_LEVEL_UNSPECIFIED = 0;   // 미판정
  DEPLOY_AUTOMATION_LEVEL_L1_STAGE_ONLY = 1; // 다운로드만. 서비스 무영향, 완전 가역 (최고위험 자산)
  DEPLOY_AUTOMATION_LEVEL_L2_STAGE_INSTALL = 2; // 설치까지, 활성화·재시작은 수동 (프로덕션 기본값)
  DEPLOY_AUTOMATION_LEVEL_L3_FULL_AUTO = 3;  // 활성화+재시작까지(ActivationHooks 사용). 롤백도 대칭
}

// 계획 lifecycle (§3.3③ 리뷰-확정). FINALIZED만 프로비저닝 실행 근거(§3.7 최강 게이트 —
// finalized 아닌 계획은 실행 거부). 링/도메인 단위 부분 확정 허용.
enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;  // 미상
  PLAN_STATUS_DRAFT = 1;        // 작성 중
  PLAN_STATUS_IN_REVIEW = 2;    // 판정이 끝나 승인을 기다린다. 판정한 쪽이 이 상태로 넘긴다
  PLAN_STATUS_FINALIZED = 3;    // 전 필수항목 판정 + 승인 서명 완료 → 실행 가능. 승인(pqcota-approve)만이 이 상태를 만든다
}

// Remediation taxonomy 조치 종류 (프로비저닝 설계 §4.1 OpenSSL / §4.2 JCA 조치 컬럼).
// 리뷰어가 자산 상태에서 판정하는 "무엇을"(§4.1 계획 레이어). core 생성기가 이 값으로 아티팩트를 분기.
enum RemediationKind {
  REMEDIATION_KIND_UNSPECIFIED = 0;
  REMEDIATION_KIND_CONFIG_ONLY = 1;     // config만 (OpenSSL 3.5+ / JDK 네이티브) — 레거시를 건드리지 않는다
  REMEDIATION_KIND_PROVIDER_INJECT = 2; // provider 배치 + config (OpenSSL 3.0–3.4 / JCA provider JAR)
  REMEDIATION_KIND_FORK_REPLACE = 3;    // 포크 교체 (OpenSSL 1.1.1·1.0.2)
  REMEDIATION_KIND_PROXY_FRONT = 4;     // 프록시 프론팅 (레거시를 건드리지 않는 대안)
  REMEDIATION_KIND_REBUILD = 5;         // 재빌드(CI) — 정적·벤더링·셰이딩
  REMEDIATION_KIND_JDK_UPGRADE = 6;     // JDK 업그레이드 (EOL JDK)
  REMEDIATION_KIND_APP_RECONFIG = 7;    // 앱 코드·설정 변경 (그룹 고정·명시 지목 앱)
  REMEDIATION_KIND_DECOMMISSION = 8;    // 폐기 또는 리스크 수용 (EOL·저가치)
}

// 단일 자산에 대한 조치 한 건 (인벤토리 설계 PlanItem). 리뷰어가 판정(MANUAL),
// config_artifact는 core 생성기가 결정론적으로 렌더(§1.2 파생 — 원본에서 재생성 가능).
// ActivationHooks — L3(활성화·재시작)에서 실행할 **사용자가 적은 명령**.
//
// ★ 어떻게 활성화하고 재시작하는지는 환경마다 다르다(systemd·커스텀 init·컨테이너 오케스트레이터,
// include 방식, 서비스 이름…). 도구가 이를 추측하면 남의 운영을 망가뜨리므로 **추측하지 않는다**(§2.5).
// 대신 사용자가 자기 환경의 명령을 적고, 생성기는 그것을 **의미에 맞는 순서로** 배치한다:
//
//	forward : pre → [모듈·config 배치] → activate → restart
//	rollback: pre → deactivate → [배치 파일 제거] → restart
//
// 빈 훅은 그 단계를 만들지 않되 **무엇이 빠졌는지 고지**한다(activate 없으면 조각이 참조되지 않고,
// restart 없으면 새 provider가 로드되지 않으며, deactivate 없으면 롤백이 활성화를 되돌리지 못한다).
message ActivationHooks {
  string pre = 1;        // 조치 전 내릴 것 — LB에서 제외·서비스 정지 등(선택)
  string activate = 2;   // 조각이 실제 참조되게 — include 추가·symlink·java.security 편집
  string deactivate = 3; // activate의 역 — 롤백에서 쓴다
  string restart = 4;    // 프로세스 재시작 — 새 provider를 로드시킨다
}

message RemediationAction {
  string id = 1;
  string target_node_id = 2; // 스코프 마스터 앵커(§1.4)
  // 근거 Finding(수용 원칙 §2.4). **호환용 주 근거**다 — 새 소비자는 evidence_sources를 읽는다.
  // evidence_sources가 있으면 이 값은 evidence_sources[0].finding_id와 **같아야 한다. 비어 있어도
  // 예외가 아니다** — 빈값을 봐주면 옛 소비자는 근거 없이, 새 소비자는 주 근거로 읽어 둘이 갈린다.
  // 생성기가 검사하고, 어긋나면 그 근거를 해결하지 않고 불완전으로 센다.
  string finding_id = 3;

  pqcota.common.v1.CryptoRuntime crypto_runtime = 4; // openssl | jca 분기(docs/runtime-acceptance.md)
  RemediationKind kind = 5;                          // taxonomy 조치(프로비저닝 설계 §4.1·§4.2)
  DeployAutomationLevel automation_level = 6;        // L1/L2/L3 자산별(§4.3)

  string target_algorithm = 7; // 목표 표준. posture.Remediate 산출. 예 "ML-KEM (FIPS 203)"
  // 넣을 provider의 이름. **이 값이 모듈 파일명이 된다** — OpenSSL이면 "<이름>.so", JCA면
  // "<이름>.jar"로 타깃에 놓인다. 그래서 OpenSSL은 아무 이름이나 쓸 수 있다(경로만 정하면 되므로).
  // JCA는 java.security에 등록 클래스를 적어야 하는데, 이름에서 클래스를 유도할 수 있는 것은
  // "BC"와 "BCFIPS"(="BC-FJA")뿐이다 — 그 밖의 이름은 provider_class에 FQCN을 함께 줘야 한다.
  // 비우면 OpenSSL은 "provider", JCA는 "BC"로 본다. kind=PROVIDER_INJECT가 아니면 쓰이지 않는다.
  string provider_choice = 8;
  string config_artifact = 9;  // core 생성기 산출: openssl.cnf provider 섹션 / java.security 라인
  string rollback_note = 10;   // 가역성(프로비저닝 설계 §4.1 "레거시를 건드리나"·롤백 방법). 예 "cnf 한 줄 삭제"
  int32 priority = 11;         // 조치 우선순위. posture.Remediation.Priority (0 없음 ~ 4 즉시)

  // JCA provider의 정식 클래스명(FQCN). 예 "com.acme.jce.AcmeProvider".
  // 왜 별도 필드인가: OpenSSL은 모듈 **경로**만 알면 되고 그 경로는 생성기가 정하지만, JCA는
  // java.security에 **FQCN**을 적어야 하는데 벤더마다 패키지 구조가 달라 provider_choice에서
  // 유도할 수 없다. BC/BC-FJA만 알려져 있어 확정되고, 그 외 커스텀 provider는 여기에 명시해야
  // 계획만으로 완결된다(비우면 알려진 이름은 자동, 미상은 placeholder + 경고).
  // OpenSSL 조치에는 쓰이지 않는다.
  string provider_class = 12;
  // 활성화·재시작 훅(L3). 비어 있으면 그 단계를 만들지 않는다 — 추측하지 않는다(§2.5).
  ActivationHooks activation = 13;
  // 이 조치의 근거들 — 어느 finding이, 어느 스냅샷 상태에서. 대개 하나. 같은 자산을 원천 노드
  // 여럿이 봤으면 여럿이고, 주 근거가 앞이다. 복수 단위를 「스냅샷」이 아니라 「근거」로 둔 것은,
  // 스냅샷만 여럿 두면 finding_id가 하나라 둘째 스냅샷의 어느 finding이 근거인지 말할 수 없기
  // 때문이다. 비어 있으면 생성기가 계획 단위 derived_from_snapshot_id를 호환 경로로 읽는다.
  repeated ActionEvidenceSource evidence_sources = 14;
}

// ActionEvidenceSource — 조치의 근거 하나.
message ActionEvidenceSource {
  // 그 스냅샷 안의 finding. **비울 수 없다** — 무엇의 근거인지 말하지 못하는 근거는, 참조가 맞아도
  // 아무것도 가리키지 않는다. 생성기는 이것이 있는지 보고, 찾은 스냅샷에 이 id가 실제로 있는지도 본다.
  string finding_id = 1;
  SnapshotReference snapshot = 2;
}

// SnapshotReference — 어느 스냅샷 상태인가. 이력이 준 실제 id 이거나, 만드는 쪽이 같은 규칙으로 계산한
// 내용 지문이다. 「관측 사건」이 아니라 「중복 억제된 상태」를 가리킨다 — 같은 상태를 다시 관측하면
// 이력은 새 행을 만들지 않는다.
message SnapshotReference {
  // 이력이 그 스냅샷을 저장한 노드 이름 — 봉투의 target_node_id. 조치의 target_node_id(선언 이름)와
  // 다를 수 있다: 여러 관측 이름이 선언 노드 하나에 걸리는 구성에서 그렇다. 생성기는 이 둘이 같아야
  // 한다는 조건을 두지 않는다 — 그 대응은 계획을 만든 쪽(선언)이 정한 것이라 여기서 검증하지 못한다.
  string source_node_id = 1;
  oneof reference {
    string snapshot_id = 2;              // 이력이 준 실제 id
    SnapshotContentReference content = 3; // 내용 지문
  }
}

// SnapshotContentReference — 내용 지문. 해시 알고리즘이 아니라 **어떤 필드를 어떤 순서로** 해시했는지
// (format_version)와 그 스냅샷의 규칙 판을 함께 든다. 지문 안에 규칙 판이 들어 있어 조건이 겹치지만,
// 참조가 규칙 판을 밝히면 못 찾았을 때 「규칙 판이 다르다」를 추측이 아니라 값으로 말할 수 있다.
message SnapshotContentReference {
  string format_version = 1;  // 예: "pqcota-snapshot-content/v1". 모르는 값이면 잘못된 참조다
  string digest = 2;          // 소문자 16진수 64자
  string ruleset_version = 3; // **스냅샷의** 규칙 판(pqcota-enrich/…). 계획의 규칙 판이 아니다
}

// 계획 봉투 — 판정을 끝낸 계획(IN_REVIEW)부터 실행 승인까지 끝난 계획(FINALIZED)까지 **같은
// 메시지로 운반한다.** 이름은 FINALIZED만 담는 것처럼 읽히지만 그렇지 않다. 이름을 바꾸면
// 소비자가 깨지므로 두고, 여기에 적는다.
//
// 판정과 실행 승인은 다른 단계다. 판정한 쪽은 status=IN_REVIEW, approval_signatures와
// finalized_at을 **비운 채** 넘기고, 승인(pqcota-approve)이 FINALIZED로 올리며 시각을 찍고
// 그 상태를 서명한다. 프로비저닝의 실행 근거가 되는 것은 FINALIZED뿐이다(§3.7·§5).
// 스키마=contracts SSOT(공개).
message FinalizedPlan {
  string id = 1;
  PlanStatus status = 2;                    // IN_REVIEW=판정 끝·승인 전 / FINALIZED=승인 끝. FINALIZED 아니면 실행 거부(§3.7 최강 게이트)
  string scope = 3;                         // 링/도메인 — 부분 확정 허용(§3.3③)
  repeated RemediationAction actions = 4;   // 순서 의미 있음(§4.1 "어떤 순서로")
  repeated string approval_signatures = 5;  // 실행 승인 서명(§3.3③). 판정한 쪽은 비운다 — 승인이 채운다. IN_REVIEW에 값이 있으면 손상
  // 어떤 스냅샷에서(§1.2). **이전 판 호환 경로.** 조치마다 근거를 두는 evidence_sources가 우선이고, 조치에
  // 근거가 하나도 없을 때만 생성기가 이 값을 읽는다(실제 id로만, 원천 노드를 알 수 없어). 계획이
  // 여러 노드에 걸치면 이 하나로는 가리킬 수 없어 비워 둔다.
  string derived_from_snapshot_id = 6;
  string ruleset_version = 7;               // 생성 규칙 버전(§1.2 재현)
  google.protobuf.Timestamp finalized_at = 8; // 첫 승인이 찍는다. 판정한 쪽은 비운다. IN_REVIEW에 값이 있으면 손상
}
