// PQC 마이그레이션 플랫폼 — 정규화된 CBOM 파생 Finding 스키마 (SSOT, DISCOVERY 단계)
//
// 규정서 §3.2 확정: 정규 형식 = CycloneDX CBOM(표준 본문) + Envelope(provenance)
//                    + evidence 메타데이터(확장). CycloneDX 본문 자체는 표준(ECMA-424)이므로
//                    여기서 재모델링하지 않고 CollectionResult.cbom_cyclonedx로 bytes 운반한다.
// 이 파일은 코어 정규화 파이프라인이 그 본문에서 파생하는 타입드 Finding을 고정한다.

syntax = "proto3";

package pqcota.discovery.v1;

import "pqcota/common/v1/common.proto";

option go_package = "github.com/randyinthedev-hash/pqcota-common/gen/pqcota/discovery/v1;discoveryv1";

// ─────────────────────────────────────────────────────────────────────────
// 런타임별 분기 축 (수용 원칙 §2.4)
// ─────────────────────────────────────────────────────────────────────────

message OpensslAxes {
  string lib = 1;                     // libssl / libcrypto
  string version = 2;                 // "unknown" 대신 빈 문자열 + evidence로 표현
  string fork = 3;                    // OpenSSL|BoringSSL|LibreSSL|AWS-LC (동일 soname 문제, 수용 원칙 §2.2)
  pqcota.common.v1.OpensslBindingMode binding_mode = 4;
  // path — 이 라이브러리 파일의 절대 경로. 한 노드에 파일 이름이 같은 설치본이 둘 이상일 때
  // (시스템 libssl.so.3과 앱이 번들한 libssl.so.3) 둘을 가르는 것이 이것이고, finding id에도 들어간다.
  // 비어 있으면 경로를 모르는 입력이다(외부 CBOM 등) — 지어내지 않는다.
  string path = 5;
}

message JcaAxes {
  string jdk_vendor = 1;
  string jdk_version = 2;
  // provider_set: 등록 "순서 포함". 우선순위 협상(수용 원칙 §2.2 (d)) 판정의 근거.
  // 목록상 앞선 provider가 같은 알고리즘을 먼저 서비스하면 새 provider는 무시된다.
  //
  // **비어 있으면 뜻이 둘이다.** instances가 있으면 「배포본의 JVM이 체인 여럿으로 관측됐거나 일부 JVM의
  // 체인을 보지 못했다」이고, 변형마다의 체인은 instances에 있다. instances가 없으면 「체인을 보지 못했다」다.
  repeated string provider_set = 3;
  // registration_mode: instances가 있으면 모든 인스턴스가 같은 모드일 때만 그 값이고, 섞이면 UNSPECIFIED다
  // (모드별 개수는 instances[].mode_counts).
  pqcota.common.v1.JcaRegistrationMode registration_mode = 4;
  // instances — 이 배포본(finding 하나)에서 관측한 JVM을 설정 변형으로 묶은 것. 아무것도 버리지 않는다.
  // variant_key 순으로 정렬한다. 옛 수집기의 입력에는 없다(빈 목록).
  repeated JcaInstance instances = 5;
  // app_key_kind — 배포본 키를 무엇으로 골랐나: systemd-unit · systemd-user-unit · jar-path · jar-name ·
  // module · main-class · source-file · java-home · exe-path · launcher-default. jar-name·java-home·exe-path는
  // 약한 키다(서로 다른 앱이 한 배포본으로 묶일 수 있다). 비어 있으면 옛 수집기의 입력이고 옛 규칙의 id다.
  // 키 값은 컴포넌트 이름(`jca-provider-chain@<키>`)에 **줄이지 않고** 싣는다 — 코어가 그 이름으로 id를 만든다.
  string app_key_kind = 6;
  // observation_scope — 이 결과가 배포본의 어디까지를 관측 대상으로 삼았나. 비면 노드에서 찾은 JVM 전부다.
  // "selected-pid"면 수집기가 지정한 JVM만 관측했다(pqcota-jvmscan --pid). 같은 배포본의 다른 JVM은
  // instances에 체인 없는 변형으로 남고, 이 결과만으로 배포본 전체의 before를 기록하지 않는다.
  string observation_scope = 7;
}

// JcaInstance — 한 배포본 안의 설정 변형 하나. 고른 세 입력(java_home, 보안 속성 설정의 유무·값)과 관측한
// 체인이 같은 JVM을 하나로 묶고 count로 센다. **이 키가 같다는 것은 그 입력과 관측한 체인이 같다는 뜻일
// 뿐이다.** 다른 -D 설정이나 실행 중 상태는 다를 수 있다. PID는 넣지 않는다(재시작마다 바뀐다).
message JcaInstance {
  // variant_key — 세 입력과 체인을 필드 순서가 고정된 구조로 직렬화한 바이트의 전체 SHA-256(hex). 묶는 키다.
  // 화면에는 앞 12자리만 보인다.
  string variant_key = 1;
  string java_home = 2;
  // security_properties_set / security_properties — -Djava.security.properties가 있었나와 그 값 그대로.
  // 값의 앞 "=" 하나(덮어쓰기 "==…"의 둘째 등호)까지 그대로 두어 덧붙이기와 덮어쓰기가 다른 변형이 된다.
  bool security_properties_set = 3;
  string security_properties = 4;
  // chain_observed — false면 이 변형의 JVM은 체인을 보지 못했다(attach와 정적 폴백이 모두 실패). 그때
  // provider_set은 비고 pqc_readiness는 unknown이다. 빈 체인을 본 것과 다르다.
  bool chain_observed = 5;
  repeated string provider_set = 6;     // 관측한 체인, 등록 순서 그대로
  // registration_mode — 이 변형의 JVM이 모두 같은 모드일 때만 그 값이다. 섞이면 UNSPECIFIED이고 mode_counts가 사실이다.
  pqcota.common.v1.JcaRegistrationMode registration_mode = 7;
  string pqc_readiness = 8;             // 정규화가 이 변형의 체인으로 계산한다(finding의 pqc_readiness와 같은 말)
  string fips_validation = 9;
  uint32 count = 10;                    // 이 변형으로 본 JVM 수(= mode_counts의 합)
  // mode_counts — 모드별 JVM 수. 모드 열거값 순으로 정렬하고 0인 모드는 싣지 않는다. 정적 폴백과 런타임
  // 관측이 같은 체인을 보고하면 같은 변형이 되므로, 어느 쪽인지는 여기에만 남는다.
  repeated JcaModeCount mode_counts = 11;
}

message JcaModeCount {
  pqcota.common.v1.JcaRegistrationMode mode = 1;
  uint32 count = 2;
}

// CngAxes — Windows CNG 분기축. v0.1.0에서 스키마로만 예약했고 **v0.6.0에서 채워졌다**:
// pqcota-cngscan이 관측하고 정규화(pkg/inventory/normalize)가 이 축을 파생한다. 필드는 provider
// 동형성(수용 원칙 §2.1)이 보장하는 것만 최소로 두고, 실물 관측이 정한 나머지(algorithms)는 그때
// **번호를 새로 부여해 더했다**(proto3 additive — 하위호환).
message CngAxes {
  // provider_set: 등록된 CNG provider(KSP/SSP) 목록. **관측된 순서 그대로** 담는다 — 정렬하지
  // 않는 이유는 관측한 대로 적기 때문이고, 그 순서가 곧 우선순위인지는 CNG에서 **아직 확인되지
  // 않았다**(JcaAxes에서 물려받은 전제다). 실측: Windows 11 26200에서 알고리즘 50개가 전부
  // provider 하나씩이라 우선순위 다툼 자체가 일어나지 않았다.
  repeated string provider_set = 1;

  // algorithms: 그 머신의 CNG가 열거한 알고리즘. **v0.6.0 실측 뒤에 번호를 부여해 더했다** —
  // provider 이름만으로는 "이 노드가 ML-DSA를 할 수 있나"에 답할 수 없기 때문이다(Windows 11
  // 26200 실측: provider 9개는 전부 Microsoft 이름이고, PQC 여부는 알고리즘 목록에만 나온다).
  // 순수 additive라 기존 필드 번호·타입은 그대로다.
  repeated CngAlgorithm algorithms = 2;
}

// CngAlgorithm — CNG가 열거한 알고리즘 하나.
message CngAlgorithm {
  // name: CNG가 부르는 이름 그대로(예 "ML-DSA"·"ECDH_P256"). 도구가 고쳐 부르지 않는다 —
  // 관측한 문자열이 그대로 남아야 재정규화가 재현된다(§1.2).
  string name = 1;
  // class: cipher · hash · asymmetric-encryption · secret-agreement · signature · rng ·
  // key-derivation. **모르면 빈 값**이다(§2.5 unknown은 1급) — 모르는 종류를 아는 것으로 적지 않는다.
  string class = 2;

  // providers: 이 알고리즘을 **실제로 구현하는** provider들(`BCryptEnumProviders`). 등록 목록
  // (CngAxes.provider_set)은 머신에 무엇이 있는지만 나타내고, 어느 provider가 무엇을 서비스하는지는
  // 말하지 않는다 — 조치 대상을 고르려면 이쪽이 필요하다. 못 물었으면 **빈 목록**이다(§2.6).
  repeated string providers = 3;
}

// ─────────────────────────────────────────────────────────────────────────
// Finding (수용 원칙 §2.4 · 규정서 §2.4) — 코어 정규화 파이프라인이 파생하는 뷰
//
// ★ Collector는 이 타입을 직접 생성하지 않는다. Collector는 표준 CycloneDX +
//   Envelope만 반환하고(§1.6), 코어 파이프라인의 강화 단계(§2.4 step 3)가
//   detection_method → evidence_strength, version → pqc_readiness, fork 판별 등을
//   부착해 Finding으로 파생한다. 파생 뷰이므로 원본에서 항상 재계산 가능(§1.2).
// ─────────────────────────────────────────────────────────────────────────

message Finding {
  string id = 1;                       // 정규화 해시 — finding 동일성/dedup 앵커 (§2.4)
  pqcota.common.v1.CryptoRuntime crypto_runtime = 2;    // 1급 분기 필드
  pqcota.common.v1.UsageContext usage_context = 3;
  string algorithm = 4;                // 비었으면 소스 부재로 열화됨 (§2.3)

  // ─ evidence 메타데이터 (§2.3 핵심) ─
  pqcota.common.v1.DetectionMethod detection_method = 5;   // Envelope에서 전파 (finding별로 다를 수 있음)
  pqcota.common.v1.EvidenceStrength evidence_strength = 6; // detection_method에서 파생 (§2.5 AUTO)

  // ─ 런타임별 분기 (수용 원칙 §2.4) ─
  oneof runtime_axes {
    OpensslAxes openssl = 7;
    JcaAxes jca = 8;
    // oneof arm은 Finding의 필드 번호 공간을 공유한다 — 7·8 다음 빈 번호가 아니라 메시지 전체에서
    // 안 쓰인 번호(15)를 쓴다. 9~14는 아래 공통 축이 이미 점유.
    CngAxes cng = 15; // v0.1.0 예약 · v0.6.0부터 정규화가 채운다
  }

  // ─ 공통 판정 축 (강화 단계 산출) ─
  string pqc_readiness = 9;     // version→매핑 (§2.4 step 3). JCA는 "네이티브 ∨ provider보강" (수용 원칙 §2.2)
  string fips_validation = 10;  // 내부 provider는 FIPS 140-3 미검증 태깅 (수용 원칙 §2.3)
  string remediation_class = 11;// remediation taxonomy 분기 키 (프로비저닝 설계 §4.1·§4.2)

  // ─ 파생 뷰 재현성 (§1.2) ─
  string derived_from_snapshot_id = 12; // 어떤 원시 스냅샷에서 파생됐나
  string ruleset_version = 13;          // 어떤 강화 규칙 버전으로 파생됐나 (재계산 재현)

  // ─ 자산이 어느 앱 것인지 (asset.proto) ─
  // 이 finding(라이브러리)을 로드한 애플리케이션(들). 보통 1개지만, host-wide 스캔에서 하나의 공유
  // 라이브러리(예: libcrypto.so.3)를 여러 앱이 로드하면 **여러 앱에 걸린다** — 그 .so 교체는 모든
  // 로더 앱에 영향. 각 원소가 머신 스코프 키라 (node_id[스냅샷]+app_key)=전역 유일.
  repeated string app_keys = 14;
}
